# Builds Wicktail for Android.
#  - "wicktail-test-apk": an installable test build (app id com.wicktail.game.test) for your phone and testers.
#  - "wicktail-release-aab": the bundle for Google Play. It is signed with your upload key when these repository
#    secrets exist: WT_KEYSTORE_BASE64, WT_KEYSTORE_PASSWORD, WT_KEY_ALIAS, WT_KEY_PASSWORD. Otherwise it is unsigned.
# Every run gets a higher versionCode (the run number), which Google Play needs for each new upload.
name: android-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Assemble the offline game files
        run: |
          set -e
          W=android-app/www
          rm -rf "$W" && mkdir -p "$W"
          cp -r android-app/shell/. "$W"/
          cp -r art "$W"/art
          cp -r play/vo "$W"/vo
          python3 - <<'PY'
          import json, subprocess
          aref = json.load(open('android-app/aref.json'))
          for name, sha in aref.items():
              data = subprocess.check_output(['git', 'show', f'{sha}:{name}'])
              open('android-app/www/' + name, 'wb').write(data)
              print(name, sha[:7], len(data))
          PY
          du -sh "$W"
      - name: Copy the game into the Android project
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android
      - name: Prepare the upload key (only if the secrets are set)
        env:
          KS: ${{ secrets.WT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "WT_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release bundle will be signed with your upload key."
          else
            echo "No upload key secrets: the release bundle will be unsigned."
          fi
      - name: Build the test APK and the release bundle
        working-directory: android-app/android
        env:
          WT_KEYSTORE_PASSWORD: ${{ secrets.WT_KEYSTORE_PASSWORD }}
          WT_KEY_ALIAS: ${{ secrets.WT_KEY_ALIAS }}
          WT_KEY_PASSWORD: ${{ secrets.WT_KEY_PASSWORD }}
          WT_VERSION_CODE: ${{ github.run_number }}
          WT_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          ls -la app/build/outputs/apk/debug app/build/outputs/bundle/release
      - uses: actions/upload-artifact@v4
        with:
          name: wicktail-test-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: wicktail-release-aab
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
          compression-level: 0

<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0b3a"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Wicktail">

<style>html,body{margin:0;height:100%;background:#1a0b3a;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}[hidden]{display:none!important}</style>
</head><body>
<title>Wicktail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; HUD pills in the corners; touch joystick bottom-left, action buttons bottom-right */
:root{--void:#0b0520;--ink:#fff7e6;--gold:#ffd23f;--magenta:#ff3fa4;--cyan:#3ff0ff;--plum:#3a0b6a;--panel:rgba(14,6,36,.62);
  --display:'Bungee','Arial Black',Impact,sans-serif;--ui:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--ui);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(7,3,26,.55) 100%)}
.chrome{background:linear-gradient(180deg,#fff 0%,#d6ecff 34%,#4a5aa8 49%,#2a1a5a 51%,#ffe9a8 54%,#ff9a3c 78%,#fff4c8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #1a0b3a;filter:drop-shadow(0 3px 0 var(--magenta)) drop-shadow(0 6px 0 var(--plum)) drop-shadow(0 0 20px rgba(63,240,255,.4))}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 12px;font:400 16px/1 var(--display);backdrop-filter:blur(6px)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud-l{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap}
.hud-r{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center}
.face{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffb860,#e8601e);display:grid;place-items:center;font-size:11px;color:#3a1406}
.orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 20%,#ffe14a 45%,#ff9a1a 80%);box-shadow:0 0 8px #ffd23f}
.crt{width:15px;height:15px;background:#b07a34;border:2px solid #5a3410;border-radius:2px}
#hWard{color:var(--gold);text-shadow:0 0 10px rgba(255,210,63,.8)}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:var(--panel);color:var(--ink);font:400 12px/1 var(--display);cursor:pointer}
#bossBar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:min(320px,70vw);text-align:center;pointer-events:none}
.bb-name{font:400 13px/1.1 var(--display);text-shadow:0 2px 0 var(--magenta);margin-bottom:6px}
.bb-track{height:12px;border-radius:6px;background:rgba(20,8,50,.75);border:2px solid #fff;overflow:hidden}
.bb-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff3fa4,#ffd23f);transition:width .3s}
#hint{position:fixed;left:0;right:0;top:calc(104px + env(safe-area-inset-top,0px));text-align:center;z-index:7;pointer-events:none;font:400 clamp(13px,3.8vw,18px)/1.2 var(--display);text-shadow:0 2px 0 var(--magenta),0 0 12px rgba(63,240,255,.6);opacity:0;transition:opacity .25s;padding:0 16px}
#hint.show{opacity:1}
#banner{position:fixed;left:0;right:0;top:20%;z-index:7;text-align:center;pointer-events:none;opacity:0;transform:scale(.7);transition:opacity .4s,transform .5s cubic-bezier(.2,1.6,.4,1)}
#banner.show{opacity:1;transform:scale(1)}
#bSmall{font:700 13px/1 var(--ui);letter-spacing:.3em;color:var(--cyan);margin-bottom:8px}#bBig{font:400 clamp(28px,8.5vw,64px)/1.05 var(--display);padding:0 16px}
#pops{position:fixed;inset:0;pointer-events:none;z-index:8}
.pop{position:absolute;left:50%;top:calc(140px + env(safe-area-inset-top,0px));white-space:nowrap;font:400 clamp(16px,4.6vw,24px)/1 var(--display);color:var(--gold);text-shadow:0 3px 0 var(--magenta),0 5px 0 var(--plum);animation:popup 1.1s ease-out forwards}
@keyframes popup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50px)}}
#fade{position:fixed;inset:0;z-index:9;background:#07031a;opacity:0;pointer-events:none}
#controls{position:fixed;inset:0;z-index:4;pointer-events:none}
#touchZone{position:absolute;left:0;bottom:0;width:55%;height:70%;pointer-events:auto}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(14,6,36,.3);opacity:0;transition:opacity .15s;pointer-events:none;left:24px;bottom:30px}
#stick.on{opacity:1}#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 12px rgba(255,255,255,.4)}
.btns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:170px;height:170px;pointer-events:none}
.btn{position:absolute;border-radius:50%;border:0;display:grid;place-items:center;font:400 12px/1 var(--display);pointer-events:auto;cursor:pointer;touch-action:none;transition:transform .08s}
.btn.down{transform:scale(.9)}
#bJump{right:0;bottom:0;width:84px;height:84px;background:linear-gradient(180deg,#fff6b0,var(--gold) 55%,#ff9a3c);box-shadow:0 4px 0 var(--magenta);color:#1a0b3a;font-size:14px}
#bSpin{right:92px;bottom:8px;width:66px;height:66px;background:linear-gradient(180deg,#d8feff,var(--cyan) 55%,#1a8aff);box-shadow:0 4px 0 #1a3a8a;color:#0a1a3a}
#bBlast{right:12px;bottom:94px;width:66px;height:66px;background:linear-gradient(180deg,#ffd8a0,#ff8a3a);box-shadow:0 4px 0 #8a2a00;color:#3a0a00;font-size:10px;text-align:center;line-height:1.1}
@media (hover:hover) and (pointer:fine){.btns{opacity:.75}}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.logo{margin:0;font:400 clamp(52px,16vw,120px)/.9 var(--display);letter-spacing:.02em}
.sub{margin:0;font:700 12px/1.3 var(--ui);letter-spacing:.3em;color:#e8dcff;text-shadow:0 1px 2px #000}
.big{font:400 clamp(18px,5vw,24px)/1 var(--display);color:#1a0b3a;cursor:pointer;border:0;border-radius:14px;padding:16px 30px;background:linear-gradient(180deg,#fff6b0,var(--gold) 45%,#ff9a3c);box-shadow:0 5px 0 var(--magenta),0 9px 0 var(--plum)}
.big:active{transform:translateY(4px)}
.small{font:700 12px/1 var(--ui);letter-spacing:.14em;color:var(--ink);background:var(--panel);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:11px 16px;cursor:pointer}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06)}}
.loader{z-index:12;background:radial-gradient(ellipse at 50% 40%,#2a1060 0%,#07031a 70%)}
.lbar{width:min(300px,76vw);height:10px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);overflow:hidden}
.lbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--magenta),var(--gold));transition:width .25s}
.ltxt{margin:0;font:700 11px/1 var(--ui);letter-spacing:.24em;color:#cfc0f5;text-transform:uppercase}
.title-screen{justify-content:space-between;background:linear-gradient(180deg,rgba(7,3,26,.6) 0%,rgba(7,3,26,0) 30%,rgba(7,3,26,0) 55%,rgba(7,3,26,.8) 100%)}
.tg{display:flex;flex-direction:column;align-items:center;gap:12px}
.keys{font:500 12px/1.6 var(--ui);color:#cfc0f5;max-width:34ch}
.keys b{color:var(--cyan)}
.dim{background:rgba(7,3,26,.8)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(400px,100%)}
.stat{background:var(--panel);border:1px solid rgba(185,138,255,.35);border-radius:12px;padding:10px 4px;display:grid;gap:5px}
.stat span{font:700 10px/1 var(--ui);letter-spacing:.18em;color:var(--cyan)}.stat b{font:400 20px/1 var(--display);color:var(--gold)}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.ht{color:rgba(255,255,255,.22);font-size:18px;line-height:1;transition:color .2s}.ht.on{color:#ff3a5a;text-shadow:0 0 8px rgba(255,58,90,.7)}
#hHp{gap:3px}#hHp.hit{animation:hpShake .4s}@keyframes hpShake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#140a2a;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;font:400 20px/1.3 var(--display)}
#rotate .ph{width:54px;height:92px;border:4px solid #ffd23f;border-radius:12px;animation:rot 1.8s ease-in-out infinite}
#rotate small{font:500 14px/1.4 system-ui,sans-serif;opacity:.7}
@keyframes rot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
.lvpick{display:flex;align-items:center;justify-content:center;gap:12px}.lvb{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(20,8,48,.55);color:#fff;font:400 24px/1 var(--display);cursor:pointer}.lvb:disabled{opacity:.25;cursor:default}.overBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
<div id="stage"></div>
<div id="rotate"><div class="ph"></div>TURN YOUR PHONE SIDEWAYS<small>Wicktail plays in landscape</small></div>
<div id="hud" hidden>
  <div class="hud-l"><span class="pill"><span class="face">F</span><span id="hLives">×4</span></span><span class="pill" id="hHp"></span><span class="pill"><span class="orb"></span><span id="hOrbs">0</span></span><span class="pill" id="hWard">✦</span></div>
  <div class="hud-r"><span class="pill"><span class="crt"></span><span id="hCrates">0/0</span></span><button id="pauseBtn" type="button" aria-label="Pause">II</button></div>
</div>
<div id="bossBar" hidden><div class="bb-name">THE SLEEPY SUN</div><div class="bb-track"><div class="bb-fill" id="bbFill"></div></div></div>
<div id="hint"></div>
<div id="banner"><div id="bSmall">LEVEL 1</div><div id="bBig" class="chrome">SLEEPY-SUN VILLAGE</div></div>
<div id="pops"></div>
<div id="controls" hidden><div id="touchZone"></div><div id="stick"><div id="knob"></div></div>
  <div class="btns"><button class="btn" id="bJump" type="button">JUMP</button><button class="btn" id="bSpin" type="button">SPIN</button><button class="btn" id="bBlast" type="button">LANTERN<br>BLAST</button></div></div>
<div id="fade"></div>
<div id="loader" class="screen loader">
  <h1 class="logo chrome">WICKTAIL</h1><p class="sub">A FLINT WICKTAIL ADVENTURE</p>
  <div class="lbar"><b id="lfill"></b></div><p class="ltxt" id="ltxt">Loading…</p>
  <button id="tapStart" class="big pulse" type="button" hidden>TAP TO START</button>
</div>
<div id="title" class="screen title-screen" hidden>
  <div class="tg"><h1 class="logo chrome">WICKTAIL</h1><div class="lvpick"><button id="lvPrev" class="lvb" type="button" aria-label="Previous level">‹</button><p class="sub" id="lvName">LEVEL 1 · SLEEPY-SUN VILLAGE</p><button id="lvNext" class="lvb" type="button" aria-label="Next level">›</button></div></div>
  <div class="tg"><button id="playBtn" class="big pulse" type="button">PLAY</button>
    <p class="keys">Left thumb moves · right side turns the camera</p>
    <button id="muteBtn" class="small" type="button">SOUND ON</button></div>
</div>
<div id="pause" class="screen dim" hidden><h2 class="logo chrome" style="font-size:clamp(40px,12vw,80px)">PAUSED</h2><button id="resumeBtn" class="big" type="button">KEEP GOING</button></div>
<div id="over" class="screen dim" hidden><h2 class="logo chrome" id="overTitle" style="font-size:clamp(34px,10vw,72px)">LEVEL COMPLETE</h2><p class="sub" id="overSub"></p>
  <div class="stats"><div class="stat"><span>ORBS</span><b id="sOrbs">0</b></div><div class="stat"><span>CRATES</span><b id="sCrates">0/0</b></div><div class="stat"><span>TIME</span><b id="sTime">0:00</b></div></div>
  <div class="overBtns"><button id="nextBtn" class="big pulse" type="button" hidden>NEXT LEVEL</button><button id="againBtn" class="big" type="button">PLAY AGAIN</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="assets.js"></script>
<script>
(() => {
'use strict';
const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0], TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const LANES=[-2.2,0,2.2];
const WORLD_LEN=600;

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
$('stage').appendChild(renderer.domElement);
const ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(68,1,0.1,500);
const hemi=new THREE.HemisphereLight(0xffffff,0x332255,0.95);scene.add(hemi);
const dirL=new THREE.DirectionalLight(0xffffff,0.85);dirL.position.set(-5,10,7);scene.add(dirL);
scene.fog=new THREE.Fog(0x000000,40,188);

/* ---------- canvas texture kit ---------- */
function canvasOf(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function texSmooth(w,h,draw,rx=1,ry=1){const c=canvasOf(w,h);draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;return t;}
function tex(w,h,draw,rx=1,ry=1){const t=texSmooth(w,h,draw,rx,ry);const f=w>=256?4:2;const c=canvasOf(Math.max(16,w/f|0),Math.max(16,h/f|0));const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(t.image,0,0,c.width,c.height);t.image=c;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;t.needsUpdate=true;return t;}
function wrapped(w,h,x,y,r,fn){for(const dx of[-w,0,w])for(const dy of[-h,0,h]){const X=x+dx,Y=y+dy;if(X+r<0||X-r>w||Y+r<0||Y-r>h)continue;fn(X,Y);}}
function speckle(g,w,h,n,cols,a,b,alpha=1){g.globalAlpha=alpha;for(let i=0;i<n;i++){g.fillStyle=pick(cols);const s=R(a,b);g.fillRect(R(0,w),R(0,h),s,s);}g.globalAlpha=1;}
function blobs(g,w,h,n,cols,rmin,rmax,alpha=1,blur=0){g.save();g.globalAlpha=alpha;if(blur)g.filter=`blur(${blur}px)`;for(let i=0;i<n;i++){const r=R(rmin,rmax),x=R(0,w),y=R(0,h),c=pick(cols);wrapped(w,h,x,y,r+blur*3,(X,Y)=>{g.fillStyle=c;g.beginPath();g.arc(X,Y,r,0,TAU);g.fill();});}g.restore();}
function fillBg(g,w,h,c){g.fillStyle=c;g.fillRect(0,0,w,h);}
function stoneTex(grout,cols,rows,cols2,rx,ry,extra){return tex(512,512,(g,w,h)=>{fillBg(g,w,h,grout);const cw=w/cols2,ch=h/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<=cols2;c++){const x=(c+(r%2?.5:0))*cw+R(-4,4),y=(r+.5)*ch+R(-3,3),ex=cw*R(.38,.47),ey=ch*R(.36,.45),col=pick(cols),rot=R(-.25,.25);
    wrapped(w,h,x,y,Math.max(ex,ey),(X,Y)=>{g.save();g.translate(X,Y);g.rotate(rot);g.beginPath();g.ellipse(0,0,ex,ey,0,0,TAU);g.fillStyle=col;g.fill();
      const hg=g.createRadialGradient(-ex*.35,-ey*.45,1,0,0,Math.max(ex,ey));hg.addColorStop(0,'rgba(255,255,255,.42)');hg.addColorStop(.55,'rgba(255,255,255,0)');hg.addColorStop(1,'rgba(0,0,0,.38)');g.fillStyle=hg;g.fill();g.restore();});}
  speckle(g,w,h,5000,['#000','#fff'],1,2.2,.13);if(extra)extra(g,w,h);},rx,ry);}
function grassTex(base,cols,rx,ry,extra){return tex(256,256,(g,w,h)=>{fillBg(g,w,h,base);blobs(g,w,h,50,cols,10,30,.35,6);g.lineWidth=1.4;
  for(let i=0;i<3000;i++){const x=R(0,w),y=R(0,h);g.strokeStyle=pick(cols);g.beginPath();g.moveTo(x,y);g.lineTo(x+R(-3,3),y-R(4,10));g.stroke();}if(extra)extra(g,w,h);},rx,ry);}
function spotsTex(base,spots,n,a,b,rx=1,ry=1,blurBg){return tex(256,256,(g,w,h)=>{fillBg(g,w,h,base);if(blurBg)blobs(g,w,h,30,blurBg,10,30,.4,8);speckle(g,w,h,1500,['#000','#fff'],1,2,.12);
  for(let i=0;i<n;i++){const r=R(a,b),x=R(0,w),y=R(0,h),c=pick(spots);wrapped(w,h,x,y,r*1.6,(X,Y)=>{const gr=g.createRadialGradient(X-r*.3,Y-r*.3,0,X,Y,r);gr.addColorStop(0,'#fff');gr.addColorStop(.35,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(X,Y,r,0,TAU);g.fill();});}},rx,ry);}
function noiseTex(base,cols,rx=1,ry=1,streak){return tex(256,256,(g,w,h)=>{fillBg(g,w,h,base);blobs(g,w,h,90,cols,4,18,.45,3);
  if(streak){g.globalAlpha=.35;for(let i=0;i<220;i++){g.fillStyle=pick(cols);g.fillRect(R(0,w),R(-20,h),R(1,4),R(20,90));}g.globalAlpha=1;}
  speckle(g,w,h,3000,['#000','#fff'],1,2,.14);},rx,ry);}
function stripesTex(a,b,n,rx=1,ry=1){return tex(256,256,(g,w,h)=>{fillBg(g,w,h,a);g.fillStyle=b;const s=w/n;for(let i=-n;i<n*2;i++){g.beginPath();g.moveTo(i*s,0);g.lineTo(i*s+s/2,0);g.lineTo(i*s+s/2+w*.6,h);g.lineTo(i*s+w*.6,h);g.closePath();g.fill();}

function sparkle(g,x,y,s,c){g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,y,0,x,y,s*2);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,s*2,0,TAU);g.fill();

function blip(f1,f2,dur,type='sine',vol=.15,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(sfxBus);o.start(t);o.stop(t+dur+.05);}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(t,freq,dur,type,vol,dest,o={}){const os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.setValueAtTime(freq,t);
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.5;lg.gain.value=freq*.012;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.1);}
  if(o.cut){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.cut,t);f.Q.value=o.q||2;os.connect(f);f.connect(g);}else os.connect(g);
  const a=o.a||.005;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setTargetAtTime(0,t+dur*.6,dur*.25+.01);g.connect(dest);if(o.send)g.connect(delayIn);os.start(t);os.stop(t+dur*1.8+.1);}
function noise(t,dur,vol,type,freq,dest){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,R(0,.5));s.stop(t+dur+.02);}
function kick(t,v=1){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(.9*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.35);}

    else{const h=por?4.7:3.3,d=por?7.4:5.4;const dx=camera.position.x-P.pos.x,dz=camera.position.z-P.pos.z;if(keys['q'])camDrag-=dt*2.4;if(keys['e'])camDrag+=dt*2.4;camManualT-=dt;if(camDrag){camYaw-=camDrag;camDrag=0;camManualT=Math.max(camManualT,1.2);camera.position.set(P.pos.x+Math.sin(camYaw)*d,camera.position.y,P.pos.z+Math.cos(camYaw)*d);}else if(camManualT<=0&&Math.hypot(dx,dz)>.5)camYaw=lerpAngle(camYaw,Math.atan2(dx,dz),Math.min(1,dt*2.2));
      camTarget.set(P.pos.x+Math.sin(camYaw)*d,P.pos.y+h,P.pos.z+Math.cos(camYaw)*d);
      L.clampCam(camTarget);
      camera.position.lerp(camTarget,Math.min(1,dt*5));camera.position.x+=R(-sk,sk);camera.position.y+=R(-sk,sk);
      camera.lookAt(P.pos.x-Math.sin(camYaw)*5,P.pos.y+1,P.pos.z-Math.cos(camYaw)*5);}}
  if(sunSky)sunSky.position.set(camera.position.x,camera.position.y+30,camera.position.z-90);if(skySun&&skySun.visible){skySun.position.set(camera.position.x*.8,camera.position.y+20,camera.position.z-95);skySun.lookAt(camera.position);skySun.rotation.z+=Math.sin(time*.4)*.05;}
  if(hintT>0){hintT-=dt;if(hintT<=0)$('hint').classList.remove('show');}
  updAtmos(dt);draw();}
function lerpAngle(a,b,k){let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*k;}

function brighten(o,k=.32){o.traverse(m=>{if(!m.isMesh)return;const ms=Array.isArray(m.material)?m.material:[m.material];ms.forEach(mt=>{if('metalness' in mt){mt.metalness=0;mt.roughness=.85;}if(mt.map&&mt.emissive){mt.emissiveMap=mt.map;mt.emissive=new THREE.Color(k,k,k);}mt.needsUpdate=true;});});}
function norm(o,size,center){brighten(o);o.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(o),sz=b.getSize(V3()),k=size/Math.max(sz.x,sz.y,sz.z);const c=b.getCenter(V3());o.scale.multiplyScalar(k);o.position.set(-c.x*k,center?-c.y*k:-b.min.y*k,-c.z*k);const g=new THREE.Group();g.add(o);
  g.traverse(m=>{if(m.isMesh&&m.material.map){m.material.map.magFilter=THREE.NearestFilter;}});return g;}
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=()=>rej(new Error(src));document.head.appendChild(e);});}
function goLevel(n){try{localStorage.setItem('wt-level',String(n));}catch(e){}location.hash='level'+n;location.reload();}
/* ---------- boot ---------- */
(async function boot(){const bar=$('lfill'),txt=$('ltxt');const step=(p,t)=>{bar.style.width=p+'%';txt.textContent=t;};
  try{step(15,'Waking Flint…');await new Promise(r=>setTimeout(r,30));flintGL=await loadGLB(WT_ASSETS.flint);setupFlint(flintGL);
    step(65,'Stacking crates…');const cg=await loadGLB(WT_ASSETS.crate);crateProto=cg.scene;brighten(crateProto,.35);{const b=new THREE.Box3().setFromObject(crateProto),sz=b.getSize(V3());crateProto.scale.set(1/sz.x,1/sz.y,1/sz.z);const b2=new THREE.Box3().setFromObject(crateProto);const c=b2.getCenter(V3());crateProto.position.set(-c.x,-b2.min.y,-c.z);const w=new THREE.Group();w.add(crateProto);crateProto=w;}
    try{await loadScript('assets'+LV+'.js');Object.assign(WT_ASSETS,window.WT_LV||{});}catch(e){}
    if(WT_ASSETS.sun){step(75,'Waking the Sleepy Sun…');const sg=await loadGLB(WT_ASSETS.sun);sunModel=norm(sg.scene,1,true);boss.obj=sunModel;sunModel.visible=false;scene.add(sunModel);
      const sg2=await loadGLB(WT_ASSETS.sun);skySun=norm(sg2.scene,1,true);skySun.scale.setScalar(26);skySun.traverse(m=>{if(m.isMesh){m.material.fog=false;if(m.material.emissive)m.material.emissive=new THREE.Color(0x3a1000);}});scene.add(skySun);sunSky.visible=false;}
    if(WT_ASSETS.raven){const rg=await loadGLB(WT_ASSETS.raven);ravenProto=norm(rg.scene,1.75,false);}
    if(WT_ASSETS.cinder){step(80,'Lighting the chimneys…');const cg2=await loadGLB(WT_ASSETS.cinder);cinderProto=norm(cg2.scene,1.25,false);}
    if(WT_ASSETS.brat){step(78,'Stirring the brew…');bratProto=norm((await loadGLB(WT_ASSETS.brat)).scene,1.3,false);}
    if(WT_ASSETS.goblin&&WT_ASSETS.cauldron){step(82,'Waking the Goblin…');gobProto=norm((await loadGLB(WT_ASSETS.goblin)).scene,3.2,false);cauldronProto=norm((await loadGLB(WT_ASSETS.cauldron)).scene,3.6,false);setupGoblinBoss();}
    step(88,'Building '+L.name.toLowerCase()+'…');populate();updHUD();step(100,'Ready');}
  catch(err){txt.textContent='Could not load: '+err;return;}
  $('tapStart').hidden=false;state='title';P.pos.copy(L.start);checkpoint.copy(L.start);flint.position.copy(P.pos);
  $('tapStart').addEventListener('click',()=>{initAudio();playCfg(TITLE_MUS);const l=$('loader');l.style.transition='opacity .5s';l.style.opacity='0';setTimeout(()=>l.hidden=true,500);$('title').hidden=false;});
  $('playBtn').addEventListener('click',()=>{initAudio();try{const d=document.documentElement;if(matchMedia('(pointer:coarse)').matches&&d.requestFullscreen)d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{});}catch(e){}startGame();});})();
setupFX();resize();requestAnimationFrame(frame);

})();

</script>
